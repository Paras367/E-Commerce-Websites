<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — KAARVAN</title>
<meta name="description" content="Login to your KAARVAN account.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><path d=%22M16 3 L27 10 L27 22 L16 29 L5 22 L5 10 Z%22 fill=%22%23b8842c%22/></svg>">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body>
<div id="site-header-root"></div>

<div class="auth-shell">
  <div class="auth-visual">
    <span class="eyebrow">Welcome Back</span>
    <h2>Pick up right where you left off</h2>
    <p>Your cart, wishlist and order history are all waiting for you.</p>
  </div>
  <div class="auth-form-side">
    <div class="auth-form-wrap">
      <h1 style="font-size:1.6rem;margin-bottom:6px">Login to KAARVAN</h1>
      <p class="text-muted" style="margin-bottom:26px;font-size:0.9rem">New here? <a href="register.html" style="color:var(--gold-dark);font-weight:700;text-decoration:underline">Create an account</a></p>

      <form id="loginForm" novalidate>
        <div class="form-field">
          <label>Email or Phone Number</label>
          <input type="text" id="loginId" placeholder="you@example.com">
          <span class="form-error-msg"></span>
        </div>
        <div class="form-field">
          <label>Password</label>
          <div class="input-icon-wrap">
            <input type="password" id="loginPassword" placeholder="Enter your password">
            <button type="button" id="togglePwVisibility" aria-label="Show password"><i data-lucide="eye" class="icon-sm"></i></button>
          </div>
          <span class="form-error-msg"></span>
        </div>
        <div class="flex justify-between items-center" style="margin-bottom:20px">
          <label class="checkbox-row"><input type="checkbox" checked> Remember me</label>
          <a href="forgot-password.html" style="font-size:0.82rem;color:var(--gold-dark);font-weight:600">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginSubmitBtn">Login</button>
      </form>

      <div class="auth-divider">or continue with</div>
      <button type="button" class="btn btn-outline btn-block" id="googleLoginBtn"><i class="fa-brands fa-google"></i> Continue with Google</button>

      <p class="text-muted" style="font-size:0.76rem;margin-top:20px;text-align:center">This is a frontend demo — no real account is created or verified.</p>
    </div>
  </div>
</div>

<div id="site-footer-root"></div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/product-card.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
