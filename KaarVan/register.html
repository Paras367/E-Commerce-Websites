<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — KAARVAN</title>
<meta name="description" content="Create a new KAARVAN account.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><path d=%22M16 3 L27 10 L27 22 L16 29 L5 22 L5 10 Z%22 fill=%22%23b8842c%22/></svg>">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body>
<div id="site-header-root"></div>

<div class="auth-shell">
  <div class="auth-visual">
    <span class="eyebrow">Join the Caravan</span>
    <h2>Everyday essentials, festive finds</h2>
    <p>Create an account to track orders, save favourites and check out faster.</p>
  </div>
  <div class="auth-form-side">
    <div class="auth-form-wrap">
      <h1 style="font-size:1.6rem;margin-bottom:6px">Create your account</h1>
      <p class="text-muted" style="margin-bottom:26px;font-size:0.9rem">Already have an account? <a href="login.html" style="color:var(--gold-dark);font-weight:700;text-decoration:underline">Login</a></p>

      <form id="registerForm" novalidate>
        <div class="form-field">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Your full name">
          <span class="form-error-msg"></span>
        </div>
        <div class="form-field">
          <label>Email Address</label>
          <input type="email" id="regEmail" placeholder="you@example.com">
          <span class="form-error-msg"></span>
        </div>
        <div class="form-field">
          <label>Phone Number</label>
          <input type="tel" id="regPhone" maxlength="10" placeholder="10-digit mobile number">
          <span class="form-error-msg"></span>
        </div>
        <div class="form-field">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="At least 6 characters">
          <span class="form-error-msg"></span>
        </div>
        <div class="form-field">
          <label>Confirm Password</label>
          <input type="password" id="regPasswordConfirm" placeholder="Re-enter password">
          <span class="form-error-msg"></span>
        </div>
        <label class="checkbox-row" style="margin-bottom:20px"><input type="checkbox" required> I agree to the Terms of Service and Privacy Policy</label>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerSubmitBtn">Create Account</button>
      </form>
      <p class="text-muted" style="font-size:0.76rem;margin-top:20px;text-align:center">This is a frontend demo — no real account is created or verified.</p>
    </div>
  </div>
</div>

<div id="site-footer-root"></div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/product-card.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
