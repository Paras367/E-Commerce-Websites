<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — KAARVAN</title>
<meta id="metaDescription" name="description" content="Shop premium products on KAARVAN.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><path d=%22M16 3 L27 10 L27 22 L16 29 L5 22 L5 10 Z%22 fill=%22%23b8842c%22/></svg>">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<style>
.product-detail-grid { display: grid; grid-template-columns: 480px 1fr; gap: 44px; align-items: start; }
.gallery-main-wrap { position: relative; border-radius: var(--radius-lg); overflow: hidden; background: var(--surface-2); border: 1px solid var(--border); }
.gallery-main-wrap img { width: 100%; aspect-ratio: 1/1; object-fit: cover; cursor: zoom-in; }
.gallery-thumbs { display: flex; gap: 10px; margin-top: 12px; overflow-x: auto; }
.gallery-thumb { width: 68px; height: 68px; border-radius: var(--radius-sm); overflow: hidden; border: 2px solid var(--border); flex-shrink: 0; }
.gallery-thumb.active { border-color: var(--gold); }
.gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }
.gallery-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; }
.gallery-nav.prev { left: 10px; } .gallery-nav.next { right: 10px; }
.gallery-zoom-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(255,255,255,0.9); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 0.72rem; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.fbt-row { display: flex; align-items: flex-start; gap: 10px; overflow-x: auto; padding: 10px 0; }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<div id="site-header-root"></div>

<main id="main" class="container">
  <div id="productNotFound" class="empty-state hide">
    <div class="icon-wrap"><i data-lucide="package-x" class="icon-lg"></i></div>
    <h3>This product isn't available</h3>
    <p>It may have been removed or the link is incorrect.</p>
    <a href="products.html" class="btn btn-primary">Browse Products</a>
  </div>

  <div id="productContent">
    <nav class="breadcrumbs">
      <a href="index.html">Home</a><span class="sep">/</span>
      <a href="products.html" id="breadcrumbCategory">Category</a><span class="sep">/</span>
      <span class="current" id="breadcrumbName">Product</span>
    </nav>

    <div class="product-detail-grid" style="padding-bottom:40px">
      <div>
        <div class="gallery-main-wrap">
          <img id="galleryMain" alt="Product image">
          <button type="button" class="gallery-nav prev" id="galleryPrev" aria-label="Previous image"><i data-lucide="chevron-left" class="icon-sm"></i></button>
          <button type="button" class="gallery-nav next" id="galleryNext" aria-label="Next image"><i data-lucide="chevron-right" class="icon-sm"></i></button>
          <button type="button" class="gallery-zoom-btn" id="galleryZoom"><i data-lucide="expand" class="icon-sm"></i> Zoom</button>
        </div>
        <div class="gallery-thumbs" id="galleryThumbs"></div>
      </div>
      <div id="buyBox"></div>
    </div>

    <section style="padding-bottom:40px">
      <div class="tabs" id="infoTabs" data-panels="infoTabPanels">
        <button type="button" class="tab-btn active" data-tab="highlights">Highlights</button>
        <button type="button" class="tab-btn" data-tab="description">Description</button>
        <button type="button" class="tab-btn" data-tab="specs">Specifications</button>
      </div>
      <div id="infoTabPanels">
        <div class="tab-panel active" data-tab="highlights" id="tabHighlights"></div>
        <div class="tab-panel" data-tab="description" id="tabDescription"></div>
        <div class="tab-panel" data-tab="specs" id="tabSpecs"></div>
      </div>
    </section>

    <section style="padding-bottom:40px">
      <h2 style="margin-bottom:18px">Frequently Bought Together</h2>
      <div class="panel">
        <div class="fbt-row" id="fbtGrid"></div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
          <span>Total: <strong id="fbtTotal" style="font-size:1.1rem"></strong></span>
          <button type="button" class="btn btn-primary" id="fbtAddAll"><i data-lucide="shopping-cart" class="icon-sm"></i> Add All to Cart</button>
        </div>
      </div>
    </section>

    <section style="padding-bottom:40px" id="reviewsSection">
      <h2 style="margin-bottom:18px">Ratings &amp; Reviews</h2>
      <div style="display:grid;grid-template-columns:300px 1fr;gap:40px" class="reviews-grid">
        <div id="reviewSummary"></div>
        <div>
          <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
            <select id="reviewSort" style="padding:8px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface)">
              <option value="recent">Most Recent</option>
              <option value="helpful">Most Helpful</option>
              <option value="high">Highest Rated</option>
              <option value="low">Lowest Rated</option>
            </select>
          </div>
          <div id="reviewsList"></div>
        </div>
      </div>
    </section>

    <section class="bg-alt" style="border-radius:var(--radius-lg);padding:32px;margin-bottom:20px">
      <div class="section-head">
        <div class="heading-group"><span class="eyebrow">You May Also Like</span><h2>Similar Products</h2></div>
      </div>
      <div class="rail" id="similarRail"></div>
    </section>

    <section class="section hide" id="recentlyViewedSection">
      <div class="section-head">
        <div class="heading-group"><span class="eyebrow">Your History</span><h2>Recently Viewed</h2></div>
      </div>
      <div class="rail" id="recentlyViewedRail"></div>
    </section>
  </div>
</main>

<div class="modal" id="zoomModal">
  <div class="modal-panel" style="max-width:820px;background:transparent;box-shadow:none">
    <button type="button" class="modal-close" id="zoomClose" aria-label="Close"><i data-lucide="x" class="icon-sm"></i></button>
    <img id="zoomImg" style="width:100%;border-radius:var(--radius-lg)" alt="Zoomed product image">
  </div>
</div>

<div id="site-footer-root"></div>
<div id="float-stack-root"></div>
<div id="mobile-nav-root"></div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/product-card.js"></script>
<script src="js/app.js"></script>
<script src="js/product.js"></script>
</body>
</html>
