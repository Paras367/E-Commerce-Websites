<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Placed — KAARVAN</title>
<meta name="description" content="Your KAARVAN order has been placed successfully.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><path d=%22M16 3 L27 10 L27 22 L16 29 L5 22 L5 10 Z%22 fill=%22%23b8842c%22/></svg>">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body>
<div id="site-header-root"></div>

<main class="container" style="max-width:640px;padding-top:20px;padding-bottom:60px">
  <div id="successContent">
    <div class="empty-state">
      <div class="icon-wrap" style="background:var(--success-bg);color:var(--success);border-color:var(--success)"><i data-lucide="check" class="icon-lg"></i></div>
      <h1 style="margin-bottom:6px">Order Placed Successfully</h1>
      <p>Order ID <strong id="orderIdLabel" style="color:var(--text)"></strong> &middot; a confirmation has been sent to your registered contact.</p>
    </div>

    <div class="panel" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px">
        <div><span class="text-muted" style="font-size:0.78rem">Estimated Delivery</span><div style="font-weight:700" id="orderEtaLabel"></div></div>
        <div><span class="text-muted" style="font-size:0.78rem">Payment Method</span><div style="font-weight:700" id="orderPaymentLabel"></div></div>
      </div>
      <div id="orderItemsList" style="border-top:1px solid var(--border);padding-top:12px"></div>
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <a href="orders.html" id="trackOrderLink" class="btn btn-primary btn-lg" style="flex:1">Track Order</a>
      <a href="products.html" class="btn btn-outline btn-lg" style="flex:1">Continue Shopping</a>
    </div>
  </div>

  <div class="empty-state hide" id="noOrderState">
    <div class="icon-wrap"><i data-lucide="package-x" class="icon-lg"></i></div>
    <h3>No recent order found</h3>
    <p>Looks like there's nothing to show here yet.</p>
    <a href="products.html" class="btn btn-primary">Start Shopping</a>
  </div>
</main>

<div id="site-footer-root"></div>
<div id="mobile-nav-root"></div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/product-card.js"></script>
<script src="js/app.js"></script>
<script src="js/order-success.js"></script>
</body>
</html>
